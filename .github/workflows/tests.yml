name: Laboratory checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pytest -q
      - run: python -m argon_lab demo --out work/demo
      - run: python -m argon_lab replay --run work/demo
